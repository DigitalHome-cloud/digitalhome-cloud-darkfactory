version: 1
backend:
  phases:
    build:
      commands:
        - npm ci
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - echo "umbrella deploys backend only — no frontend artifacts"
  artifacts:
    baseDirectory: .
    files: []
  cache:
    paths:
      - node_modules/**/*
